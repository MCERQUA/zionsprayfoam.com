<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>Form Detection</title></head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field">
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="hidden" name="traffic_source" />
      <input type="hidden" name="landing_url" />
    </form>
    <form name="get-a-quote" data-netlify="true" netlify-honeypot="bot-field">
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="property-type" />
      <input type="text" name="service-needed" />
      <input type="hidden" name="traffic_source" />
      <input type="hidden" name="landing_url" />
  <input name="street_address" />

</form>

</html>
